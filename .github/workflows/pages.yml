# Build and deploy the online paper (site/dist) to GitHub Pages.
#
# One-time setup by the repository owner: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". Until that is enabled the deploy job fails; nothing else is affected.
#
# Runs on every push to main (any path, including report/**) and on manual dispatch, so editing the
# paper in report/ republishes the site. The paper body is rendered from report/merged.tex with pandoc
# (required: the build fails if pandoc or the rendering fails, so a stale page is never shipped).
# The site is generated from checksum-verified runs pinned in report/runs.json; the build fails if
# report/generated/numbers.tex disagrees with those payloads. The PDFs are built first; if the TeX
# build fails, the site is still deployed, without PDF links.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the site footer links the build commit
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Install pandoc (required to render report/)
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends pandoc
          pandoc --version | head -1
      - name: Restore TeX package cache
        id: texcache
        uses: actions/cache/restore@v4
        with:
          path: .apt-archives/*.deb
          key: apt-tex-${{ runner.os }}-${{ hashFiles('scripts/ci_install_tex.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: apt-tex-${{ runner.os }}-${{ hashFiles('scripts/ci_install_tex.sh') }}-
      - name: Hash cached TeX packages
        id: texbefore
        run: echo "hash=${{ hashFiles('.apt-archives/*.deb') }}" >> "$GITHUB_OUTPUT"
      - name: Install TeX Live (apt)
        timeout-minutes: 25
        id: tex
        continue-on-error: true
        run: bash scripts/ci_install_tex.sh
      - name: Save TeX package cache
        # also after a timeout: the packages fetched so far are kept for the next run
        if: always() && hashFiles('.apt-archives/*.deb') != '' && hashFiles('.apt-archives/*.deb') != steps.texbefore.outputs.hash
        uses: actions/cache/save@v4
        with:
          path: .apt-archives/*.deb
          key: apt-tex-${{ runner.os }}-${{ hashFiles('scripts/ci_install_tex.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build paper PDFs from report/merged.tex (main, appendix, combined)
        id: pdf
        continue-on-error: true
        if: steps.tex.outcome == 'success'
        run: PYTHON=python bash scripts/build_report.sh
      - name: Build site
        env:
          # publish the PDFs only if the report build passed all of its checks
          PDF_ARGS: ${{ steps.pdf.outcome == 'success' && '--pdf-dir report' || '' }}
        run: python scripts/build_site.py --out site/dist $PDF_ARGS
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
