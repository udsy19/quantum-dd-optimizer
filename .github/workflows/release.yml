# Release automation: push a tag vX.Y.Z, or run this workflow by hand on main with the tag to create (see RELEASING.md).
name: release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create on the selected commit, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip build
          pip install -e ".[test]"
      - name: Install pandoc (tests/test_site.py renders the paper from report/)
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends pandoc
      - name: Test
        run: python -m pytest -q
      - name: Verify recorded runs
        run: |
          python -c "import json,subprocess,sys; r=json.load(open('report/runs.json')); sys.exit(subprocess.call([sys.executable,'-m','ddopt.provenance','verify',*['results/'+v for k,v in r.items() if not k.startswith('_')]]))"
      - name: Check version matches tag
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${TAG}" || { echo "pyproject version v$v != tag ${TAG}"; exit 1; }
      - name: Build sdist and wheel
        run: python -m build
      - name: Restore TeX package cache
        id: texcache
        uses: actions/cache/restore@v4
        with:
          path: .apt-archives/*.deb
          key: apt-tex-${{ runner.os }}-${{ hashFiles('scripts/ci_install_tex.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: apt-tex-${{ runner.os }}-${{ hashFiles('scripts/ci_install_tex.sh') }}-
      - name: Hash cached TeX packages
        id: texbefore
        run: echo "hash=${{ hashFiles('.apt-archives/*.deb') }}" >> "$GITHUB_OUTPUT"
      - name: Install TeX Live (apt)
        timeout-minutes: 25
        id: tex
        continue-on-error: true
        run: bash scripts/ci_install_tex.sh
      - name: Save TeX package cache
        # also after a timeout: the packages fetched so far are kept for the next run
        if: always() && hashFiles('.apt-archives/*.deb') != '' && hashFiles('.apt-archives/*.deb') != steps.texbefore.outputs.hash
        uses: actions/cache/save@v4
        with:
          path: .apt-archives/*.deb
          key: apt-tex-${{ runner.os }}-${{ hashFiles('scripts/ci_install_tex.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build paper PDF
        if: steps.tex.outcome == 'success'
        continue-on-error: true
        run: |
          PYTHON=python bash scripts/build_report.sh
          cp report/main.pdf dist/quantum-dd-optimizer-paper.pdf
          cp report/appendix.pdf dist/quantum-dd-optimizer-appendix.pdf
          cp report/combined_report.pdf dist/quantum-dd-optimizer-paper-with-appendix.pdf
      - name: Extract changelog section
        run: |
          python - <<'PY'
          import os, re
          tag = os.environ["TAG"].lstrip("v")
          text = open("CHANGELOG.md").read()
          m = re.search(rf"^## \[{re.escape(tag)}\].*?(?=^## \[|\Z)", text, re.S | re.M)
          body = (m.group(0) if m else f"Release {tag}") + "\n\nAll results are synthetic simulations; no hardware data.\n"
          open("RELEASE_NOTES.md", "w").write(body)
          PY
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # a release published from the GitHub web UI creates the tag first; attach the assets to it instead
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md
          else
            # on a manual run the tag does not exist yet: create it at the commit that was tested
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TAG" --notes-file RELEASE_NOTES.md
          fi
