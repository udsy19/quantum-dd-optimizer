# Release automation: push a tag vX.Y.Z (see RELEASING.md).
name: release
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip build
          pip install -e ".[test]"
      - name: Test
        run: python -m pytest -q
      - name: Verify recorded runs
        run: |
          python -c "import json,subprocess,sys; r=json.load(open('report/runs.json')); sys.exit(subprocess.call([sys.executable,'-m','ddopt.provenance','verify',*['results/'+v for k,v in r.items() if not k.startswith('_')]]))"
      - name: Check version matches tag
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "pyproject version v$v != tag ${GITHUB_REF_NAME}"; exit 1; }
      - name: Build sdist and wheel
        run: python -m build
      - name: Build paper PDF
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-publishers texlive-fonts-recommended lmodern poppler-utils
          PYTHON=python bash scripts/build_report.sh
          cp report/main.pdf dist/quantum-dd-optimizer-paper.pdf
          cp report/appendix.pdf dist/quantum-dd-optimizer-appendix.pdf
          cp report/combined_report.pdf dist/quantum-dd-optimizer-paper-with-appendix.pdf
      - name: Extract changelog section
        run: |
          python - <<'PY'
          import os, re
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md").read()
          m = re.search(rf"^## \[{re.escape(tag)}\].*?(?=^## \[|\Z)", text, re.S | re.M)
          body = (m.group(0) if m else f"Release {tag}") + "\n\nAll results are synthetic simulations; no hardware data.\n"
          open("RELEASE_NOTES.md", "w").write(body)
          PY
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
