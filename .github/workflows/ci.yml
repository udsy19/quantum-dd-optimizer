# CI for quantum-dd-optimizer.
# Runs smoke tests, evidence validation, and the IEEE main-paper plus appendix build.
name: ci
on: [push, pull_request]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # provenance manifests record the git SHA
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Install pandoc (tests/test_site.py renders the paper from report/)
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends pandoc
      - name: Record environment
        run: |
          python --version
          pip freeze
      - name: Smoke tests (not slow)
        run: python -m pytest -q -m "not slow" --junitxml=pytest-report.xml
      - name: Validate smoke config and evidence map
        run: |
          python -c "from ddopt.provenance import load_config, SMOKE_CONFIG_SCHEMA as S; load_config('configs/smoke.json', S)"
          if [ -f report/claims.json ]; then python scripts/make_evidence_map.py --check; fi
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report-py${{ matrix.python-version }}
          path: pytest-report.xml

  ionq-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install optional provider dependencies
        run: python -m pip install -e ".[test,ionq]"
      - name: Test IonQ circuit adapter without network or credentials
        env:
          IONQ_API_KEY: ""
        run: python -m pytest -q tests/test_ionq_experiment.py tests/test_research_baselines.py

  report:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Check for report source
        id: src
        run: |
          if [ -f report/main.tex ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - name: Restore TeX package cache
        if: steps.src.outputs.present == 'true'
        id: texcache
        uses: actions/cache/restore@v4
        with:
          path: .apt-archives/*.deb
          key: apt-tex-${{ runner.os }}-${{ hashFiles('scripts/ci_install_tex.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: apt-tex-${{ runner.os }}-${{ hashFiles('scripts/ci_install_tex.sh') }}-
      - name: Hash cached TeX packages
        if: steps.src.outputs.present == 'true'
        id: texbefore
        run: echo "hash=${{ hashFiles('.apt-archives/*.deb') }}" >> "$GITHUB_OUTPUT"
      - name: Install TeX Live (apt)
        timeout-minutes: 25
        if: steps.src.outputs.present == 'true'
        run: bash scripts/ci_install_tex.sh
      - name: Save TeX package cache
        # also after a timeout: the packages fetched so far are kept for the next run
        if: always() && steps.src.outputs.present == 'true' && hashFiles('.apt-archives/*.deb') != '' && hashFiles('.apt-archives/*.deb') != steps.texbefore.outputs.hash
        uses: actions/cache/save@v4
        with:
          path: .apt-archives/*.deb
          key: apt-tex-${{ runner.os }}-${{ hashFiles('scripts/ci_install_tex.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build report PDF
        if: steps.src.outputs.present == 'true'
        run: bash scripts/build_report.sh
      - name: Sync editable Overleaf source back to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo 'Newer main commits exist. Skipping stale merged.tex sync.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f report/merged.tex report/merged.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'chore: synchronize Overleaf merged source [skip ci]'
            git push origin HEAD:main
          fi
      - name: Upload report PDF
        if: always() && steps.src.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: report-pdf
          path: |
            report/merged.tex
            report/merged.pdf
            report/overleaf-project.zip
            report/combined_report.pdf
            report/main.pdf
            report/main.log
            report/appendix.pdf
            report/appendix.log
