[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ddopt"
version = "0.1.0"
description = "Model-based, hardware-aware dynamical decoupling research code (synthetic simulations only)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "cma==4.5.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: long-running numerical validation (deselect with -m 'not slow')"]
